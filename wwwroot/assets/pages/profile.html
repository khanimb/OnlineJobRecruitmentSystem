<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Profile — NexHire</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body style="background:#f8faff;min-height:100vh">

    <nav class="navbar">
        <div class="logo"><i class="ti ti-brand-speedtest"></i> NexHire<span class="logo-accent">.</span></div>
        <div class="nav-btns">
            <button class="btn-outline" onclick="history.back()"><i class="ti ti-arrow-left"></i> Back</button>
        </div>
    </nav>

    <div style="max-width:800px;margin:40px auto;padding:0 24px">

        <div class="dash-card" style="margin-bottom:20px">
            <div style="padding:32px;display:flex;align-items:center;gap:24px">
                <div id="profileAvatar" style="width:80px;height:80px;border-radius:20px;background:#eff6ff;color:#2563EB;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;flex-shrink:0">J</div>
                <div>
                    <div id="profileName" style="font-size:1.4rem;font-weight:700;color:#0f172a">Loading...</div>
                    <div id="profilePhone" style="font-size:0.9rem;color:#64748b;margin-top:4px"></div>
                    <div style="margin-top:12px">
                        <a id="cvDownload" href="#" target="_blank" style="display:none;align-items:center;gap:6px;background:#2563EB;color:#fff;padding:8px 18px;border-radius:8px;font-size:0.85rem;font-weight:600;text-decoration:none">
                            <i class="ti ti-download"></i> Download CV
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="dash-card" style="margin-bottom:20px">
            <div class="dash-card-header"><div class="dash-card-title"><i class="ti ti-tools"></i> Skills</div></div>
            <div style="padding:20px 24px">
                <div id="profileSkills" style="display:flex;flex-wrap:wrap;gap:8px"></div>
            </div>
        </div>

        <div class="dash-card">
            <div class="dash-card-header"><div class="dash-card-title"><i class="ti ti-briefcase"></i> Work Experience</div></div>
            <div style="padding:20px 24px">
                <div id="profileExperience" style="font-size:0.9rem;color:#334155;line-height:1.8;white-space:pre-wrap"></div>
            </div>
        </div>

    </div>

    <script src="../../assets/js/api.js"></script>
    <script>
        async function loadProfile() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) { document.getElementById('profileName').textContent = 'Profile not found'; return; }

            try {
                const r = await apiFetch(`/JobSeeker/profile/${id}`);
                const p = r.data;

                const name = p.fullName || 'Candidate';
                document.getElementById('profileName').textContent = name;
                document.getElementById('profileAvatar').textContent = name[0].toUpperCase();
                document.getElementById('profilePhone').textContent = p.phone || '';

                if (p.cvUrl) {
                    const cv = document.getElementById('cvDownload');
                    cv.href = 'http://localhost:5076' + p.cvUrl;
                    cv.style.display = 'inline-flex';
                }

                const skillsEl = document.getElementById('profileSkills');
                if (p.skills) {
                    skillsEl.innerHTML = p.skills.split(',').map(s =>
                        `<span class="tag tag-blue">${s.trim()}</span>`
                    ).join('');
                } else {
                    skillsEl.textContent = 'No skills listed';
                }

                document.getElementById('profileExperience').textContent = p.workExperience || 'No experience listed';

            } catch (e) {
                document.getElementById('profileName').textContent = 'Profile not found';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
