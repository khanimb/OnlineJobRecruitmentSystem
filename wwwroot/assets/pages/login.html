<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - Sign In</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        body {
            background: #f8faff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 1rem;
        }

        .auth-card {
            background: #fff;
            border: 0.5px solid #e0eaff;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(37,99,235,0.08);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 28px;
        }

            .auth-logo a {
                font-size: 22px;
                font-weight: 500;
                color: #0f172a;
                text-decoration: none;
            }

            .auth-logo span {
                color: #2563EB;
            }

        .auth-title {
            font-size: 22px;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .auth-sub {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

            .form-group label {
                display: block;
                font-size: 13px;
                font-weight: 500;
                color: #374151;
                margin-bottom: 6px;
            }

            .form-group input {
                width: 100%;
                padding: 10px 14px;
                border: 0.5px solid #e0eaff;
                border-radius: 8px;
                font-size: 14px;
                color: #0f172a;
                outline: none;
                background: #f8faff;
            }

                .form-group input:focus {
                    border-color: #93c5fd;
                    background: #fff;
                }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #64748b;
        }

        .forgot {
            font-size: 13px;
            color: #2563EB;
            text-decoration: none;
        }

        .btn-submit {
            width: 100%;
            background: #2563EB;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

            .btn-submit:hover {
                background: #1d4ed8;
            }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }

            .auth-footer a {
                color: #2563EB;
                text-decoration: none;
            }

        .error-msg {
            background: #fef2f2;
            border: 0.5px solid #fecaca;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .input-icon {
            position: relative;
        }

            .input-icon i {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: #94a3b8;
                cursor: pointer;
                font-size: 16px;
            }

            .input-icon input {
                padding-right: 40px;
            }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="#">About</a>
        </div>
        <div class="nav-btns">
            <button class="btn-outline" onclick="window.location.href='login.html'">Sign in</button>
            <button class="btn-primary" onclick="window.location.href='register.html'">Get started</button>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../index.html"><i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span>.</span></a>
            </div>
            <div class="auth-title">Welcome back</div>
            <div class="auth-sub">Sign in to your account to continue</div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label>Email address</label>
                <input type="email" id="email" placeholder="you@example.com" />
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-icon">
                    <input type="password" id="password" placeholder="••••••••" />
                    <i class="ti ti-eye" onclick="togglePassword()"></i>
                </div>
            </div>

            <div class="form-row">
                <label class="remember">
                    <input type="checkbox" /> Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button class="btn-submit" onclick="login()">Sign in</button>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="../../assets/js/api.js"></script>
    <!-- <script src="../../assets/js/auth.js"></script> -->
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.input-icon .ti');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('ti-eye', 'ti-eye-off');
            } else {
                input.type = 'password';
                icon.classList.replace('ti-eye-off', 'ti-eye');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            if (!email || !password) {
                errorMsg.textContent = 'Please fill in all fields.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const result = await apiFetch('/Auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                const data = result.data;
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data));

                if (data.role === 'Employer') {
                    window.location.href = 'employer-dashboard.html';
                } else if (data.role === 'JobSeeker') {
                    window.location.href = 'jobseeker-dashboard.html';
                } else if (data.role === 'Admin') {
                    window.location.href = 'admindashboard.html';
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Login failed. Please try again.';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
