<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - Sign In</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="#">About</a>
        </div>
        <div class="nav-btns">
            <button class="btn-outline" onclick="window.location.href='login.html'">Sign in</button>
            <button class="btn-primary" onclick="window.location.href='register.html'">Get started</button>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../index.html"><i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span>.</span></a>
            </div>
            <div class="auth-title">Welcome back</div>
            <div class="auth-sub">Sign in to your account to continue</div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label>Email address</label>
                <input type="email" id="email" placeholder="you@example.com" />
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-icon">
                    <input type="password" id="password" placeholder="••••••••" />
                    <i class="ti ti-eye" onclick="togglePassword()"></i>
                </div>
            </div>

            <div class="form-row">
                <label class="remember">
                    <input type="checkbox" /> Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button class="btn-submit" onclick="login()">Sign in</button>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="../../assets/js/api.js"></script>
    <!-- <script src="../../assets/js/auth.js"></script> -->
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.input-icon .ti');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('ti-eye', 'ti-eye-off');
            } else {
                input.type = 'password';
                icon.classList.replace('ti-eye-off', 'ti-eye');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.style.display = 'none';

            if (!email || !password) {
                errorMsg.textContent = 'Please fill in all fields.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const result = await apiFetch('/Auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                const data = result.data;
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data));

                if (data.role === 'Employer') {
                    window.location.href = 'employerdashboard.html';
                } else if (data.role === 'JobSeeker') {
                    window.location.href = 'jobseekerdashboard.html';
                } else if (data.role === 'Admin') {
                    window.location.href = 'admindashboard.html';
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Login failed. Please try again.';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
