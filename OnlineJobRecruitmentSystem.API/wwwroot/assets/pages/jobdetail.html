<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Detail — NexHire</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="window.location.href='../../index.html'" style="cursor:pointer">
            <i class="ti ti-brand-speedtest"></i> NexHire<span class="logo-accent">.</span>
        </div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="companies.html">Companies</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="nav-btns" id="navBtns">
            <button class="btn-outline" onclick="window.location.href='login.html'">Sign in</button>
            <button class="btn-primary" onclick="window.location.href='register.html'">Get started</button>
        </div>
        <button class="hamburger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></button>
    </nav>

    <div class="job-detail-page">

        <div class="job-detail-main">
            <a href="jobs.html" class="back-link"><i class="ti ti-arrow-left"></i> Back to jobs</a>

            <div id="jobContent">
                <div class="empty-state"><div class="empty-icon"><i class="ti ti-loader"></i></div><div class="empty-title">Loading...</div></div>
            </div>

            <div class="job-detail-section" id="commentsSection">
                <div class="job-detail-section-title">Comments</div>

                <div id="commentForm" style="display:none; margin-bottom: 20px;">
                    <textarea id="commentText" placeholder="Ask a question or leave a comment..." rows="3" style="width:100%; padding:10px; border-radius:8px; border:1px solid #e5e7eb;"></textarea>
                    <button class="btn-primary" style="margin-top:8px;" onclick="postComment()">Post Comment</button>
                </div>

                <div id="commentsList"></div>
            </div>

            <div class="job-detail-section" id="similarJobsSection" style="display:none">
                <div class="job-detail-section-title">Similar jobs</div>
                <div id="similarJobsList"></div>
            </div>
        </div>

        <aside class="job-detail-sidebar">
            <div class="detail-apply-card" id="applyCard" style="display:none">
                <div class="detail-salary" id="detailSalary"></div>
                <div class="detail-salary-label">Monthly salary</div>
                <button class="btn-apply" id="applyBtn" onclick="applyJob()">
                    <i class="ti ti-send"></i> Apply Now
                </button>
                <button class="btn-save-job" onclick="saveJob()">
                    <i class="ti ti-bookmark"></i> Save Job
                </button>
                <div class="detail-meta-list" id="detailMeta"></div>
            </div>
        </aside>

    </div>

    <div class="toast" id="toast"><i class="ti ti-circle-check"></i><span id="toastMsg">Done!</span></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/comment.js"></script>
    <script>
        function toggleMenu() {
            $('.nav-links').toggleClass('open');
        }

        let currentJob = null;

        async function loadJob() {
            const id = new URLSearchParams(window.location.search).get('id');
            if (!id) { $('#jobContent').html(`<div class="empty-state"><div class="empty-icon"><i class="ti ti-alert-circle"></i></div><div class="empty-title">Job not found</div></div>`); return; }

            try {
                const r = await apiFetch('/Job/' + id);
                currentJob = r.data;
                renderJob(currentJob);
                loadSimilarJobs(id);
            } catch {
                $('#jobContent').html(`<div class="empty-state"><div class="empty-icon"><i class="ti ti-alert-circle"></i></div><div class="empty-title">Job not found</div></div>`);
            }
        }

        async function loadSimilarJobs(id) {
            try {
                const r = await apiFetch(`/Job/${id}/similar`);
                const jobs = r.data || [];
                if (!jobs.length) return;
                $('#similarJobsList').html(jobs.map((j, i) => {
                    const c = colors[i % colors.length];
                    return `<div class="job-item" style="cursor:pointer" onclick="window.location.href='jobdetail.html?id=${j.id}'">
                <div class="job-logo" style="background:${c.bg};color:${c.color}">${escapeHtml((j.companyName || 'J')[0].toUpperCase())}</div>
                <div class="job-info">
                    <div class="job-name">${escapeHtml(j.title || j.jobTitle || 'Job')}</div>
                    <div class="job-meta"><span><i class="ti ti-map-pin"></i> ${escapeHtml(j.location || 'Remote')}</span><span><i class="ti ti-clock"></i> ${escapeHtml(j.jobType || 'Full-time')}</span></div>
                </div>
            </div>`;
                }).join(''));
                $('#similarJobsSection').show();
            } catch { }
        }

        function renderJob(job) {
            const rawTitle = job.title || job.jobTitle || 'Job';
            const title = escapeHtml(rawTitle);
            const company = escapeHtml(job.companyName || 'Company');
            const loc = escapeHtml(job.location || 'Remote');
            const type = escapeHtml(job.jobType || 'Full-time');
            const cat = escapeHtml(job.category || '');
            const desc = escapeHtml(job.description || '').replace(/\n/g, '<br>');
            const reqs = escapeHtml(job.requirements || '').replace(/\n/g, '<br>');
            const salMin = job.salaryMin || 0;
            const salMax = job.salaryMax || 0;

            document.title = rawTitle + ' — NexHire';

            $('#jobContent').html(`
                  <div class="job-detail-header">
                    <div class="job-detail-logo">${company[0].toUpperCase()}</div>
                    <div>
                      <div class="job-detail-title">${title}</div>
                      <div class="job-detail-company"><i class="ti ti-building"></i> ${company} &nbsp;·&nbsp; <i class="ti ti-map-pin"></i> ${loc}</div>
                      <div class="job-detail-tags">
                        <span class="tag tag-blue">${type}</span>
                        ${cat ? `<span class="tag tag-gray">${cat}</span>` : ''}
                      </div>
                    </div>
                  </div>

                  <div class="job-detail-section">
                    <div class="job-detail-section-title">About the role</div>
                    <div class="job-detail-text">${desc || 'No description provided.'}</div>
                  </div>

                  ${reqs ? `<div class="job-detail-section">
                    <div class="job-detail-section-title">Requirements</div>
                    <div class="job-detail-text">${reqs}</div>
                  </div>` : ''}
                `);

            $('#detailSalary').text(salMin ? `$${salMin.toLocaleString()} – $${salMax.toLocaleString()}` : 'Negotiable');
            $('#detailMeta').html(`
                  <div class="detail-meta-item"><i class="ti ti-clock"></i> ${type}</div>
                  <div class="detail-meta-item"><i class="ti ti-map-pin"></i> ${loc}</div>
                  ${cat ? `<div class="detail-meta-item"><i class="ti ti-tag"></i> ${cat}</div>` : ''}
                `);
            $('#applyCard').show();
        }

        async function applyJob() {
            const user = getUser ? getUser() : null;
            if (!user) { window.location.href = 'login.html'; return; }
            if (user.role !== 'JobSeeker') { showToast('Only job seekers can apply', false); return; }

            const btn = $('#applyBtn');
            btn.prop('disabled', true).html('<i class="ti ti-loader"></i> Applying...');

            try {
                await apiFetch('/JobApplication/' + currentJob.id, {
                    method: 'POST',
                    body: JSON.stringify({ coverLetter: '' })
                });
                showToast('Application submitted!');
                btn.html('<i class="ti ti-check"></i> Applied');
            } catch (err) {
                showToast(err.message || 'Failed to apply', false);
                btn.prop('disabled', false).html('<i class="ti ti-send"></i> Apply Now');
            }
        }

        async function saveJob() {
            const user = getUser ? getUser() : null;
            if (!user) { window.location.href = 'login.html'; return; }
            if (user.role !== 'JobSeeker') { showToast('Only job seekers can save jobs', false); return; }

            try {
                await apiFetch('/JobSeeker/saved/' + currentJob.id, { method: 'POST' });
                showToast('Job saved!');
            } catch (err) {
                showToast(err.message || 'Failed to save job', false);
            }
        }

        $(function () {
            loadJob();
        });
    </script>
</body>
</html>
