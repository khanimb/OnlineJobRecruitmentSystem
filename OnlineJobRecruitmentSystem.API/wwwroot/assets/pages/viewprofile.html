<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - Profile</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
        </div>
        <div class="nav-btns"></div>
        <button class="hamburger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></button>
    </nav>

    <div class="profile-page" id="profilePage">
        <div class="empty-state"><div class="empty-title">Loading profile...</div></div>
    </div>

    <div class="toast" id="toast"><i class="ti ti-circle-check"></i><span id="toastMsg"></span></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        function toggleMenu() {
            $('.nav-links').toggleClass('open');
        }

        let targetUserId = null;
        let jobSeekerProfileId = null;

        $(function () {
            const params = new URLSearchParams(window.location.search);
            targetUserId = params.get('id');

            if (!targetUserId) {
                $('#profilePage').html('<div class="empty-state"><div class="empty-title">No profile specified.</div></div>');
                return;
            }
            loadProfile();
        });

        async function loadProfile() {
            let profile;
            try {
                const r = await apiFetch('/JobSeeker/profile/' + targetUserId);
                profile = r.data;
            } catch (err) {
                $('#profilePage').html('<div class="empty-state"><div class="empty-title">Profile not found.</div></div>');
                return;
            }

            jobSeekerProfileId = profile.id;
            renderHeader(profile);
            loadRating();
            loadSkillsAndExperience(profile);
            loadPortfolio();
            loadReviews();
        }

        function renderHeader(profile) {
            const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
            const canMessage = currentUser && String(currentUser.id) !== String(targetUserId);

            $('#profilePage').html(`
                            <div class="profile-header">
                                <div class="profile-avatar">${(profile.fullName || '?')[0].toUpperCase()}</div>
                                <div>
                                    <div class="profile-name">${profile.fullName || 'Unnamed'}</div>
                                    <div class="profile-sub"><i class="ti ti-phone"></i> ${profile.phone || 'No phone provided'}</div>
                                    <div class="profile-rating" id="ratingArea"></div>
                                </div>
                                <div class="profile-header-actions">
                                    ${profile.cvUrl ? `<a class="btn-outline" href="${FILE_BASE_URL}${profile.cvUrl}" target="_blank"><i class="ti ti-file-text"></i> View CV</a>` : ''}
                                    ${canMessage ? `<button class="btn-primary" onclick="messageUser('${profile.fullName || 'User'}')"><i class="ti ti-message"></i> Message</button>` : ''}
                                </div>
                            </div>
                            <div class="profile-section">
                                <div class="profile-section-title">Skills</div>
                                <div class="skills-wrap" id="skillsArea"></div>
                            </div>
                            <div class="profile-section">
                                <div class="profile-section-title">Work experience</div>
                                <div id="experienceArea" style="color:#475569;font-size:0.9rem;line-height:1.6"></div>
                            </div>
                            <div class="profile-section">
                                <div class="profile-section-title">Portfolio</div>
                                <div class="portfolio-grid" id="portfolioArea"></div>
                            </div>
                            <div class="profile-section">
                                <div class="profile-section-title">Reviews</div>
                                <div id="reviewsArea"></div>
                            </div>
                        `);
        }

        function messageUser(name) {
            window.location.href = `message.html?userId=${targetUserId}&name=${encodeURIComponent(name)}`;
        }

        function starString(rating) {
            const rounded = Math.round(rating || 0);
            return '<i class="ti ti-star-filled"></i>'.repeat(rounded) + '<i class="ti ti-star"></i>'.repeat(5 - rounded);
        }

        async function loadRating() {
            try {
                const r = await apiFetch('/Review/user/' + targetUserId + '/rating');
                const rating = r.data || 0;
                $('#ratingArea').html(`${starString(rating)} <span>${rating.toFixed(1)} / 5</span>`);
            } catch {
                $('#ratingArea').html('<span style="color:#94a3b8">No ratings yet</span>');
            }
        }

        function loadSkillsAndExperience(profile) {
            const skills = (profile.skills || '').split(',').map(s => s.trim()).filter(Boolean);
            $('#skillsArea').html(skills.length
                ? skills.map(s => `<span class="tag tag-blue">${s}</span>`).join('')
                : '<span style="color:#94a3b8;font-size:0.85rem">No skills listed.</span>');

            $('#experienceArea').text(profile.workExperience || 'No work experience listed.');
        }

        async function loadPortfolio() {
            try {
                const r = await apiFetch('/Portfolio/' + jobSeekerProfileId);
                const items = r.data || [];
                if (!items.length) {
                    $('#portfolioArea').html('<span style="color:#94a3b8;font-size:0.85rem">No portfolio items yet.</span>');
                    return;
                }
                $('#portfolioArea').html(items.map(p => `
                                <div class="portfolio-item">
                                    <img src="${FILE_BASE_URL}${p.fileUrl}" alt="${p.title || ''}" />
                                    <div class="portfolio-item-body">
                                        <div class="portfolio-item-title">${p.title || 'Untitled'}</div>
                                        <div class="portfolio-item-desc">${p.description || ''}</div>
                                    </div>
                                </div>
                            `).join(''));
            } catch {
                $('#portfolioArea').html('<span style="color:#94a3b8;font-size:0.85rem">No portfolio items yet.</span>');
            }
        }

        async function loadReviews() {
            try {
                const r = await apiFetch('/Review/user/' + targetUserId);
                const reviews = r.data || [];
                if (!reviews.length) {
                    $('#reviewsArea').html('<span style="color:#94a3b8;font-size:0.85rem">No reviews yet.</span>');
                    return;
                }
                $('#reviewsArea').html(reviews.map(rv => `
                                <div class="review-item">
                                    <div class="review-top">
                                        <div class="review-name">${rv.reviewerName}</div>
                                        <div class="review-stars">${starString(rv.rating)}</div>
                                    </div>
                                    ${rv.comment ? `<div class="review-comment">${rv.comment}</div>` : ''}
                                    <div class="review-date">${new Date(rv.createdAt).toLocaleDateString()}</div>
                                </div>
                            `).join(''));
            } catch {
                $('#reviewsArea').html('<span style="color:#94a3b8;font-size:0.85rem">No reviews yet.</span>');
            }
        }
    </script>
</body>
</html>
