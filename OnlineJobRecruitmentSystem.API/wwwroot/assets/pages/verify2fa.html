<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - Verify Code</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="about.html">About</a>
        </div>
        <button class="hamburger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></button>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../../index.html"><i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span>.</span></a>
            </div>
            <div class="auth-title">Verify your identity</div>
            <div class="auth-sub">Enter the 6-digit code sent to your email</div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label>Verification code</label>
                <input type="text" id="code" placeholder="123456" maxlength="6" />
            </div>

            <button class="btn-submit" onclick="verifyCode()">Verify</button>

            <div class="auth-footer">
                Didn't get a code? <a href="login.html">Try logging in again</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script>
        function toggleMenu() {
            $('.nav-links').toggleClass('open');
        }

        const pendingEmail = sessionStorage.getItem('pendingEmail');
        if (!pendingEmail) {
            window.location.href = 'login.html';
        }

        async function verifyCode() {
            const code = document.getElementById('code').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            if (!code) {
                errorMsg.textContent = 'Please enter the verification code.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const result = await apiFetch('/Auth/verify-2fa', {
                    method: 'POST',
                    body: JSON.stringify({ email: pendingEmail, code })
                });

                const data = result.data;
                localStorage.setItem('token', data.token);
                localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('user', JSON.stringify(data));
                sessionStorage.removeItem('pendingEmail');

                if (data.role === 'Employer') {
                    window.location.href = 'employerdashboard.html';
                } else if (data.role === 'JobSeeker') {
                    window.location.href = 'jobseekerdashboard.html';
                } else if (data.role === 'Admin') {
                    window.location.href = 'admindashboard.html';
                }
            } catch (err) {
                errorMsg.textContent = err.message || 'Invalid or expired code.';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
