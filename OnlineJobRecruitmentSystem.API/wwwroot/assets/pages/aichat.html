<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - AI Chatbot</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
        </div>
        <div class="nav-btns">
            <button class="btn-outline" onclick="window.location.href='jobseekerdashboard.html'">Back to dashboard</button>
        </div>
        <button class="hamburger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></button>
    </nav>

    <div class="job-detail-page">
        <div style="max-width:950px;margin:30px auto;display:flex;gap:20px">
            <div style="width:220px;flex-shrink:0;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;max-height:520px;display:flex;flex-direction:column">
                <button class="btn-primary" style="width:100%;justify-content:center;margin-bottom:12px" onclick="newChat()"><i class="ti ti-plus"></i> New chat</button>
                <div style="font-size:0.7rem;color:#94a3b8;text-transform:uppercase;margin-bottom:6px">Sessions</div>
                <div id="sessionsList" style="overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:4px"></div>
            </div>
            <div class="job-detail-section" style="flex:1;margin:0">
                <div class="job-detail-section-title"><i class="ti ti-sparkles" style="color:#2563EB"></i> AI Job Assistant</div>
                <div id="chatMessages" style="max-height:420px;min-height:200px;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:10px"></div>
                <div style="display:flex;gap:8px;margin-top:14px">
                    <input type="text" id="chatInput" placeholder="Type your question..." style="flex:1;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:0.875rem;font-family:Inter,sans-serif;outline:none" />
                    <button class="btn-primary" id="chatSendBtn" onclick="sendChatMessage()"><i class="ti ti-send"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="ti ti-circle-check"></i><span id="toastMsg"></span></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        function toggleMenu() { $('.nav-links').toggleClass('open'); }

        let currentSessionId = null;

        $(function () {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (!user || (user.role !== 'JobSeeker' && user.role !== 'Employer')) { window.location.href = 'login.html'; return; }
            $('#chatInput').on('keydown', function (e) { if (e.key === 'Enter') sendChatMessage(); });
            initChat();
        });

        function sessionsKey() {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            return 'aiChatSessions_' + (user ? user.id : 'anon');
        }

        function getSessions() {
            return JSON.parse(localStorage.getItem(sessionsKey()) || '[]');
        }

        function saveSessions(sessions) {
            localStorage.setItem(sessionsKey(), JSON.stringify(sessions));
        }

        function initChat() {
            const sessions = getSessions();
            if (sessions.length) {
                currentSessionId = sessions[0].id;
                renderSessionsList();
                renderMessages();
            } else {
                newChat();
            }
        }

        function newChat() {
            const sessions = getSessions();
            const session = { id: Date.now(), title: 'New chat', messages: [] };
            sessions.unshift(session);
            saveSessions(sessions);
            currentSessionId = session.id;
            renderSessionsList();
            renderMessages();
        }

        function loadSession(id) {
            currentSessionId = id;
            renderSessionsList();
            renderMessages();
        }

        function renderSessionsList() {
            const sessions = getSessions();
            $('#sessionsList').html(sessions.map(s => `
        <div onclick="loadSession(${s.id})" style="padding:8px 10px;border-radius:8px;font-size:0.8rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:${s.id === currentSessionId ? '#eff6ff' : 'transparent'};color:${s.id === currentSessionId ? '#2563EB' : '#334155'}">${escapeHtml(s.title)}</div>
    `).join(''));
        }

        function renderMessages() {
            const sessions = getSessions();
            const session = sessions.find(s => s.id === currentSessionId);
            const messages = session ? session.messages : [];
            if (!messages.length) {
                $('#chatMessages').html('<div style="align-self:flex-start;background:#f1f5f9;color:#334155;padding:8px 14px;border-radius:12px;max-width:80%;font-size:0.85rem">Hi! Ask me anything about open jobs — e.g. "Any remote developer jobs?"</div>');
                return;
            }
            $('#chatMessages').html(messages.map(m => renderBubble(m.role, m.text)).join(''));
            $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);
        }

        function renderBubble(role, text) {
            return role === 'user'
                ? `<div style="align-self:flex-end;background:#2563EB;color:#fff;padding:8px 14px;border-radius:12px;max-width:80%;font-size:0.85rem">${escapeHtml(text)}</div>`
                : `<div style="align-self:flex-start;background:#f1f5f9;color:#334155;padding:8px 14px;border-radius:12px;max-width:80%;font-size:0.85rem">${escapeHtml(text)}</div>`;
        }

        function saveChatMessage(role, text) {
            const sessions = getSessions();
            const session = sessions.find(s => s.id === currentSessionId);
            if (!session) return;
            session.messages.push({ role, text });
            if (session.title === 'New chat' && role === 'user') {
                session.title = text.length > 30 ? text.slice(0, 30) + '...' : text;
            }
            saveSessions(sessions);
        }

        async function sendChatMessage() {
            const input = $('#chatInput');
            const msg = input.val().trim();
            if (!msg) return;
            input.val('');
            $('#chatMessages').append(renderBubble('user', msg));
            saveChatMessage('user', msg);
            renderSessionsList();

            const loadingId = 'chat-loading-' + Date.now();
            $('#chatMessages').append(`<div id="${loadingId}" style="align-self:flex-start;background:#f1f5f9;color:#334155;padding:8px 14px;border-radius:12px;max-width:80%;font-size:0.85rem">Thinking...</div>`);
            $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);

            try {
                const r = await apiFetch('/CvAnalysis/chat', { method: 'POST', body: JSON.stringify({ message: msg }) });
                const reply = r.data || 'No response.';
                $('#' + loadingId).text(reply);
                saveChatMessage('ai', reply);
            } catch (e) {
                $('#' + loadingId).text(e.message || 'Something went wrong.').css('color', '#ef4444');
            }
            $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);
        }
    </script>
</body>
</html>
