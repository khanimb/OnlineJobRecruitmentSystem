<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - AI Chatbot</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
        </div>
        <div class="nav-btns">
            <button class="btn-outline" onclick="window.location.href='jobseekerdashboard.html'">Back to dashboard</button>
        </div>
        <button class="hamburger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></button>
    </nav>

    <div class="job-detail-page">
        <div class="job-detail-main" style="max-width:700px;margin:30px auto;float:none">
            <div class="job-detail-section">
                <div class="job-detail-section-title"><i class="ti ti-sparkles" style="color:#2563EB"></i> AI Job Assistant</div>
                <div id="chatMessages" style="max-height:420px;min-height:200px;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:10px">
                    <div style="align-self:flex-start;background:#f1f5f9;color:#334155;padding:8px 14px;border-radius:12px;max-width:80%;font-size:0.85rem">Hi! Ask me anything about open jobs — e.g. "Any remote developer jobs?"</div>
                </div>
                <div style="display:flex;gap:8px;margin-top:14px">
                    <input type="text" id="chatInput" placeholder="Type your question..." style="flex:1;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:0.875rem;font-family:Inter,sans-serif;outline:none" />
                    <button class="btn-primary" id="chatSendBtn" onclick="sendChatMessage()"><i class="ti ti-send"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="ti ti-circle-check"></i><span id="toastMsg"></span></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        function toggleMenu() { $('.nav-links').toggleClass('open'); }

        $(function () {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (!user || user.role !== 'JobSeeker') { window.location.href = 'login.html'; return; }
            $('#chatInput').on('keydown', function (e) { if (e.key === 'Enter') sendChatMessage(); });
            loadChatHistory();
        });

        function getChatHistory() {
            return JSON.parse(localStorage.getItem('aiChatHistory') || '[]');
        }

        function saveChatMessage(role, text) {
            const history = getChatHistory();
            history.push({ role, text });
            localStorage.setItem('aiChatHistory', JSON.stringify(history));
        }

        function loadChatHistory() {
            const history = getChatHistory();
            if (!history.length) return;
            $('#chatMessages').html(history.map(m => renderBubble(m.role, m.text)).join(''));
            $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);
        }

        function renderBubble(role, text) {
            return role === 'user'
                ? `<div style="align-self:flex-end;background:#2563EB;color:#fff;padding:8px 14px;border-radius:12px;max-width:80%;font-size:0.85rem">${escapeHtml(text)}</div>`
                : `<div style="align-self:flex-start;background:#f1f5f9;color:#334155;padding:8px 14px;border-radius:12px;max-width:80%;font-size:0.85rem">${escapeHtml(text)}</div>`;
        }

        async function sendChatMessage() {
            const input = $('#chatInput');
            const msg = input.val().trim();
            if (!msg) return;
            input.val('');
            $('#chatMessages').append(renderBubble('user', msg));
            saveChatMessage('user', msg);

            const loadingId = 'chat-loading-' + Date.now();
            $('#chatMessages').append(`<div id="${loadingId}" style="align-self:flex-start;background:#f1f5f9;color:#334155;padding:8px 14px;border-radius:12px;max-width:80%;font-size:0.85rem">Thinking...</div>`);
            $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);

            try {
                const r = await apiFetch('/CvAnalysis/chat', { method: 'POST', body: JSON.stringify({ message: msg }) });
                const reply = r.data || 'No response.';
                $('#' + loadingId).text(reply);
                saveChatMessage('ai', reply);
            } catch (e) {
                $('#' + loadingId).text(e.message || 'Something went wrong.').css('color', '#ef4444');
            }
            $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);
        }
    </script>
</body>
</html>
