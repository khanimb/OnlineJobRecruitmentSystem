<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - Reset Password</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="#">About</a>
        </div>
        <div class="nav-btns">
            <button class="btn-outline" onclick="window.location.href='login.html'">Sign in</button>
            <button class="btn-primary" onclick="window.location.href='register.html'">Get started</button>
        </div>
        <button class="hamburger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></button>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../index.html"><i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span>.</span></a>
            </div>
            <div class="auth-title">Reset password</div>
            <div class="auth-sub">Enter your new password below.</div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg" style="display:none;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:16px;"></div>

            <div id="formArea">
                <div class="form-group">
                    <label>New password</label>
                    <div class="input-icon">
                        <input type="password" id="newPassword" placeholder="••••••••" />
                        <i class="ti ti-eye" onclick="togglePassword('newPassword', this)"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm new password</label>
                    <div class="input-icon">
                        <input type="password" id="confirmPassword" placeholder="••••••••" />
                        <i class="ti ti-eye" onclick="togglePassword('confirmPassword', this)"></i>
                    </div>
                </div>

                <button class="btn-submit" id="submitBtn">Reset password</button>
            </div>

            <div class="auth-footer">
                Remembered your password? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        function toggleMenu() {
            $('.nav-links').toggleClass('open');
        }

        let resetToken = '';

        $(function () {
            const params = new URLSearchParams(window.location.search);
            resetToken = params.get('token') || '';

            if (!resetToken) {
                $('#errorMsg').text('Invalid or missing reset link. Please request a new one.').show();
                $('#formArea').hide();
                return;
            }

            $('#submitBtn').on('click', resetPassword);
        });

        function togglePassword(inputId, icon) {
            const input = $('#' + inputId);
            if (input.attr('type') === 'password') {
                input.attr('type', 'text');
                $(icon).removeClass('ti-eye').addClass('ti-eye-off');
            } else {
                input.attr('type', 'password');
                $(icon).removeClass('ti-eye-off').addClass('ti-eye');
            }
        }

        async function resetPassword() {
            const newPassword = $('#newPassword').val();
            const confirmPassword = $('#confirmPassword').val();
            $('#errorMsg').hide();
            $('#successMsg').hide();

            if (!newPassword || !confirmPassword) {
                $('#errorMsg').text('Please fill in both fields.').show();
                return;
            }
            if (newPassword !== confirmPassword) {
                $('#errorMsg').text('Passwords do not match.').show();
                return;
            }
            if (newPassword.length < 6) {
                $('#errorMsg').text('Password must be at least 6 characters.').show();
                return;
            }

            const $btn = $('#submitBtn');
            $btn.prop('disabled', true).text('Resetting...');

            try {
                const res = await apiFetch('/Auth/reset-password', {
                    method: 'POST',
                    body: JSON.stringify({ token: resetToken, newPassword, confirmPassword })
                });
                $('#successMsg').text(res.message || 'Password reset successfully.').show();
                $('#formArea').hide();
                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch (err) {
                $('#errorMsg').text(err.message || 'Something went wrong. Please try again.').show();
                $btn.prop('disabled', false).text('Reset password');
            }
        }
    </script>
</body>
</html>
