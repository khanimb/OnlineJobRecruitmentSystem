<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - Messages</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
        </div>
        <div class="nav-btns">
            <button class="btn-outline" id="backBtn">Back to dashboard</button>
        </div>
        <button class="hamburger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></button>
    </nav>

    <div class="msg-page">
        <div class="msg-wrapper">
            <div class="msg-sidebar">
                <div class="msg-sidebar-header">Messages</div>
                <div class="msg-conv-list" id="convList"></div>
            </div>
            <div class="msg-main" id="msgMain">
                <div class="msg-empty" id="msgEmpty">Select a conversation to start messaging</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"><i class="ti ti-circle-check"></i><span id="toastMsg"></span></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/message.js"></script>
    <script>
        function toggleMenu() {
            $('.nav-links').toggleClass('open');
        }
    </script>
</body>
</html>
