<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexHire - Forgot Password</title>
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="../index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px">
                <i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span class="logo-accent">.</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="#">About</a>
        </div>
        <div class="nav-btns">
            <button class="btn-outline" onclick="window.location.href='login.html'">Sign in</button>
            <button class="btn-primary" onclick="window.location.href='register.html'">Get started</button>
        </div>
        <button class="hamburger" onclick="toggleMenu()"><i class="ti ti-menu-2"></i></button>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="../index.html"><i class="ti ti-brand-speedtest" style="color:#2563EB"></i> NexHire<span>.</span></a>
            </div>
            <div class="auth-title">Forgot password?</div>
            <div class="auth-sub">Enter your email and we'll send you a reset link.</div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg" style="display:none;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;padding:10px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:16px;"></div>

            <div class="form-group">
                <label>Email address</label>
                <input type="email" id="email" placeholder="you@example.com" />
            </div>

            <button class="btn-submit" id="submitBtn">Send reset link</button>

            <div class="auth-footer">
                Remembered your password? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script>
        $(function () {
            function toggleMenu() {
                $('.nav-links').toggleClass('open');
            }

            $('#submitBtn').on('click', sendResetLink);
            $('#email').on('keydown', function (e) {
                if (e.key === 'Enter') sendResetLink();
            });
        });

        async function sendResetLink() {
            const email = $('#email').val().trim();
            $('#errorMsg').hide();
            $('#successMsg').hide();

            if (!email) {
                $('#errorMsg').text('Please enter your email address.').show();
                return;
            }

            const $btn = $('#submitBtn');
            $btn.prop('disabled', true).text('Sending...');

            try {
                const res = await apiFetch('/Auth/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });
                $('#successMsg').text(res.message || 'If this email exists, a reset link has been sent.').show();
            } catch (err) {
                $('#errorMsg').text(err.message || 'Something went wrong. Please try again.').show();
            } finally {
                $btn.prop('disabled', false).text('Send reset link');
            }
        }
    </script>
</body>
</html>
